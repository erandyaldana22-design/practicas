<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodos JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Métodos de JavaScript</h1>

        <p id="mensaje">Hola mundo</p>

        <script>
            document.getElementById("mensaje").innerHTML = "¡Bienvenido!";
        </script>

        <p id="aviso">Mensaje inicial</p>

        <script>
            var elemento = document.getElementById("aviso");
            elemento.textContent = "Hola Estudiantes";
        </script>

        <button id="btn">Haz clic</button>

        <script>
            document.getElementById("btn").style.backgroundColor = "lightblue";
        </script>

        <div id="imagen"></div>

        <script>
            document.getElementById("imagen").innerHTML =
                '<img src="logo.jpeg" alt="Logo">';
                
        </script>

        <p class="destacado">Texto importante</p>

        <script>
            document.querySelector(".destacado").style.color = "red";
        </script>

        <button class="btn">Enviar</button>

        <script>
            document.querySelector(".btn").disabled = true;
        </script>

        <br><br>

        <a href="../index.html">Regresar al menú principal</a>

    </div>

</body>
</html>
